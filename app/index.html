<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <style>html, body { background: #0b0b0c; } @media (prefers-color-scheme: light) { html, body { background: #eceef1; } }</style>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Klientska zóna</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Tvoje tréningy, tréningový plán a progres na jednom mieste.">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Klient">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Štýly appky Tréner (1 : 1) + doplnky klientskej zóny -->
  <link rel="preload" as="image" href="../icons/hero.jpg">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <style>
    /* Úvodná obrazovka – rovnaká ako v appke Tréner (inline, ukáže sa okamžite) */
    #splash { position: fixed; inset: 0; z-index: 1000; background: #0b0b0c; display: grid; place-items: center; transition: opacity .35s ease, visibility .35s; }
    @media (prefers-color-scheme: light) { html, body, #splash { background: #eceef1 !important; } }
    #splash.hide { opacity: 0; visibility: hidden; }
    #splash .line { position: relative; width: 100vw; height: 3px; background: rgba(143, 220, 210, .12); overflow: hidden; }
    #splash .line::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, #b9ebe4, #46b3a7); box-shadow: 0 0 14px #46b3a7; transform-origin: left; animation: splash-fill .55s cubic-bezier(.45, 0, .25, 1) forwards, splash-glow .25s ease-out .55s forwards; }
    #splash .line::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .9), transparent); animation: splash-sheen .55s cubic-bezier(.45, 0, .25, 1) forwards; }
    @keyframes splash-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes splash-glow { 50% { box-shadow: 0 0 26px 4px #46b3a7; } 100% { box-shadow: 0 0 16px 1px #46b3a7; } }
    @keyframes splash-sheen { from { transform: translateX(-120%); } to { transform: translateX(280%); } }
    @media (prefers-reduced-motion: reduce) { #splash .line::before, #splash .line::after { animation: none; } }
  </style>
  <link rel="stylesheet" href="../css/trainer.css?v=7">
  <link rel="stylesheet" href="css/redesign.css?v=5">
  <link rel="stylesheet" href="css/app.css?v=20">
</head>
<body>
  <div id="splash" aria-hidden="true"><div class="line"></div></div>
  <div id="app"></div>
  <script src="js/data.js?v=8"></script>
  <script src="js/app.js?v=29"></script>
  <script src="js/exercise-icons.js?v=2"></script>
  <script src="js/live.js?v=3"></script>
  <script type="module">
    // Firebase sa načíta až po vykreslení obsahu, aby nebrzdil štart
    // Safari pri slabom signáli niekedy modul nestiahne – skúsi sa ešte 2× s pauzou
    let cloudTry = 0;
    const loadCloud = () => import(`./js/cloud.js?v=11${cloudTry ? `&pokus=${cloudTry}` : ''}`).catch(() => { cloudTry++; if (cloudTry < 3) setTimeout(loadCloud, cloudTry * 2500); });
    if (document.readyState === 'complete') loadCloud(); else window.addEventListener('load', loadCloud, { once: true });
  </script>
</body>
</html>
